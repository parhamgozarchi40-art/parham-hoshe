<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ربات هوش مصنوعی 🤖</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }
        .chat-container {
            height: calc(100vh - 160px);
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-2xl bg-white/80 backdrop-blur-md shadow-2xl rounded-3xl overflow-hidden flex flex-col border border-white/20">
        
        <!-- Header -->
        <div class="bg-white/50 p-5 border-b border-gray-200 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-blue-500 rounded-full flex items-center justify-center text-white shadow-lg">🤖</div>
                <div>
                    <h1 class="font-bold text-gray-800">ربات هوشمند</h1>
                    <p class="text-xs text-green-500 flex items-center gap-1">
                        <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span> آنلاین
                    </p>
                </div>
            </div>
        </div>

        <!-- Chat Window -->
        <div id="chat-window" class="chat-container overflow-y-auto p-6 space-y-4 flex flex-col">
            <div class="self-start bg-gray-100 text-gray-700 p-4 rounded-2xl rounded-tr-none max-w-[80%] shadow-sm">
                سلام! من آماده‌ام. چه کمکی می‌تونم بکنم؟ 😊
            </div>
        </div>

        <!-- Input Area -->
        <div class="p-4 bg-white/50 border-t border-gray-200">
            <div class="relative flex items-center">
                <input type="text" id="user-input" 
                    class="w-full p-4 pr-4 pl-14 bg-white border border-gray-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-400 transition-all shadow-sm text-gray-700"
                    placeholder="پیام خود را اینجا بنویسید...">
                <button id="send-btn" class="absolute left-2 p-2 bg-blue-500 hover:bg-blue-600 text-white rounded-xl transition-all shadow-md">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                    </svg>
                </button>
            </div>
            <p class="text-[10px] text-center text-gray-400 mt-2">🚀 Powered by Cloudflare Workers</p>
        </div>
    </div>

    <script>
        const chatWindow = document.getElementById('chat-window');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        // ===== آدرس Worker شما =====
        const WORKER_URL = 'https://delicate-wood-5c58.parhamgozarchi40.workers.dev';

        function appendMessage(role, text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = role === 'user' 
                ? 'self-end bg-blue-500 text-white p-4 rounded-2xl rounded-tl-none max-w-[80%] shadow-md'
                : 'self-start bg-gray-100 text-gray-700 p-4 rounded-2xl rounded-tr-none max-w-[80%] shadow-sm';
            msgDiv.innerText = text;
            chatWindow.appendChild(msgDiv);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            appendMessage('user', message);
            userInput.value = '';

            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'self-start bg-gray-200 text-gray-500 p-3 rounded-xl text-sm animate-pulse';
            loadingDiv.innerText = 'در حال فکر کردن... 🤔';
            chatWindow.appendChild(loadingDiv);
            chatWindow.scrollTop = chatWindow.scrollHeight;

            try {
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: message
                    })
                });

                const data = await response.json();
                chatWindow.removeChild(loadingDiv);

                if (data.choices && data.choices[0] && data.choices[0].message) {
                    const aiResponse = data.choices[0].message.content;
                    appendMessage('assistant', aiResponse);
                } else if (data.error) {
                    throw new Error(data.error);
                } else {
                    throw new Error('پاسخی دریافت نشد');
                }

            } catch (error) {
                chatWindow.removeChild(loadingDiv);
                appendMessage('assistant', '❌ خطا: ' + error.message);
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
